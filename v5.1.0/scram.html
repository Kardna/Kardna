<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kardna Scramjet</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Outfit, system-ui, sans-serif;
      overflow: hidden;
    }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      max-width: min(520px, calc(100vw - 32px));
      line-height: 1.45;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    #status.hidden {
      display: none;
    }
    #proxy-frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="status">Booting Scramjet…</div>
  <iframe id="proxy-frame" allow="fullscreen *; clipboard-read *; clipboard-write *; autoplay *; gamepad *; microphone *; camera *"></iframe>

  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <script src="scram-launcher.js"></script>
</body>
</html>
