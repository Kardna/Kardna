<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snake Shift</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="c" aria-label="Snake Shift game"></canvas><div class="hud"><div class="pill">SCORE <strong id="score">0</strong></div><div class="pill">BEST <strong id="best">0</strong></div></div><section class="panel" id="panel"><h1>SNAKE<br>SHIFT</h1><p>Eat the sparks. Avoid the walls and your own tail.</p><button class="primary" id="start">Start game</button><p class="small">Arrow keys / WASD / swipe</p></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let size=20,cols,rows,snake,dir,next,food,timer,running=false,score=0,best=Number(localStorage.snakeShiftBest||0),sx=0,sy=0;bestEl.textContent=best;
function resize(){const d=Math.min(devicePixelRatio||1,1.5);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);cols=Math.max(14,Math.floor(innerWidth/size));rows=Math.max(14,Math.floor(innerHeight/size));}addEventListener('resize',resize);resize();
function place(){do food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function start(){snake=[{x:Math.floor(cols/2),y:Math.floor(rows/2)},{x:Math.floor(cols/2)-1,y:Math.floor(rows/2)}];dir=next={x:1,y:0};score=0;scoreEl.textContent=0;place();running=true;panel.classList.add('hidden');clearInterval(timer);timer=setInterval(step,105);draw()}
function end(){running=false;clearInterval(timer);best=Math.max(best,score);localStorage.snakeShiftBest=best;bestEl.textContent=best;panel.querySelector('h1').innerHTML='GAME<br>OVER';panel.querySelector('p').textContent=`Score: ${score}. Ready for another run?`;panel.querySelector('button').textContent='Play again';panel.classList.remove('hidden')}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=cols||h.y>=rows||snake.some(p=>p.x===h.x&&p.y===h.y))return end();snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;place()}else snake.pop();draw()}
function draw(){x.fillStyle='#0b0c13';x.fillRect(0,0,innerWidth,innerHeight);x.strokeStyle='rgba(255,255,255,.035)';for(let i=0;i<cols;i++){x.beginPath();x.moveTo(i*size,0);x.lineTo(i*size,innerHeight);x.stroke()}for(let i=0;i<rows;i++){x.beginPath();x.moveTo(0,i*size);x.lineTo(innerWidth,i*size);x.stroke()}x.shadowBlur=12;x.shadowColor='#ff4fa3';x.fillStyle='#ff4fa3';x.beginPath();x.arc(food.x*size+size/2,food.y*size+size/2,size*.32,0,Math.PI*2);x.fill();x.shadowColor='#c8ff45';snake.forEach((p,i)=>{x.fillStyle=i?'#c8ff45':'#fff';x.fillRect(p.x*size+2,p.y*size+2,size-4,size-4)});x.shadowBlur=0}
function turn(nx,ny){if(!running)return;if(nx!==-dir.x||ny!==-dir.y)next={x:nx,y:ny}}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')turn(0,-1);if(k==='arrowdown'||k==='s')turn(0,1);if(k==='arrowleft'||k==='a')turn(-1,0);if(k==='arrowright'||k==='d')turn(1,0)});c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy))});document.querySelector('#start').onclick=start;</script></body></html>
