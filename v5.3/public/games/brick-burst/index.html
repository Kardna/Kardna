<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brick Burst</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="c" aria-label="Brick Burst game"></canvas><div class="hud"><div class="pill">SCORE <strong id="score">0</strong></div><div class="pill">LIVES <strong id="lives">3</strong></div></div><section class="panel" id="panel"><h1>BRICK<br>BURST</h1><p>Move the paddle, keep the pulse alive, and clear the wall.</p><button class="primary" id="start">Launch ball</button><p class="small">Mouse / touch / arrow keys</p></section></main><script>const c=document.querySelector('#c'),g=c.getContext('2d'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives');let w,h,dpr,run=false,last=0,score=0,lives=3,bricks=[],keys={};const p={x:0,y:0,w:130,h:16},b={x:0,y:0,vx:250,vy:-310,r:10};function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);p.y=h-55;p.x=Math.min(p.x,w-p.w);if(!b.x){b.x=w/2;b.y=h-90}}resize();addEventListener('resize',resize);
function build(){bricks=[];const cols=Math.max(5,Math.min(10,Math.floor(w/92))),bw=(w-40-(cols-1)*8)/cols;for(let r=0;r<5;r++)for(let col=0;col<cols;col++)bricks.push({x:20+col*(bw+8),y:75+r*34,w:bw,h:23,alive:true,c:['#5865ff','#a879ff','#ff4fa3','#ff8a3d','#c8ff45'][r]})}
function resetBall(){b.x=w/2;b.y=h-90;b.vx=(Math.random()>.5?1:-1)*(220+Math.random()*80);b.vy=-330}
function start(){score=0;lives=3;scoreEl.textContent=0;livesEl.textContent=3;p.x=w/2-p.w/2;build();resetBall();run=true;panel.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function finish(win){run=false;panel.querySelector('h1').innerHTML=win?'WALL<br>CLEARED':'ROUND<br>OVER';panel.querySelector('p').textContent=win?`Perfect clear with ${score} points.`:`You scored ${score} points.`;panel.querySelector('button').textContent='Play again';panel.classList.remove('hidden')}
function loop(t){if(!run)return;const dt=Math.min((t-last)/1000,.03);last=t;if(keys.ArrowLeft||keys.a)p.x-=420*dt;if(keys.ArrowRight||keys.d)p.x+=420*dt;p.x=Math.max(0,Math.min(w-p.w,p.x));b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r||b.x>w-b.r){b.vx*=-1;b.x=Math.max(b.r,Math.min(w-b.r,b.x))}if(b.y<b.r){b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+b.r>=p.y&&b.y-b.r<=p.y+p.h&&b.x>=p.x&&b.x<=p.x+p.w){const hit=(b.x-(p.x+p.w/2))/(p.w/2);b.vx=hit*390;b.vy=-Math.abs(b.vy)*1.02;b.y=p.y-b.r}for(const q of bricks){if(!q.alive)continue;if(b.x+b.r>q.x&&b.x-b.r<q.x+q.w&&b.y+b.r>q.y&&b.y-b.r<q.y+q.h){q.alive=false;b.vy*=-1;score+=10;scoreEl.textContent=score;break}}if(bricks.every(q=>!q.alive))return finish(true);if(b.y>h+30){lives--;livesEl.textContent=lives;if(lives<=0)return finish(false);resetBall()}draw();requestAnimationFrame(loop)}
function draw(){g.fillStyle='#090a11';g.fillRect(0,0,w,h);for(const q of bricks)if(q.alive){g.shadowBlur=12;g.shadowColor=q.c;g.fillStyle=q.c;g.fillRect(q.x,q.y,q.w,q.h)}g.shadowBlur=12;g.shadowColor='#c8ff45';g.fillStyle='#c8ff45';g.fillRect(p.x,p.y,p.w,p.h);g.shadowColor='#fff';g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.shadowBlur=0}c.addEventListener('pointermove',e=>p.x=e.clientX-p.w/2);addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);document.querySelector('#start').onclick=start;draw();</script></body></html>
