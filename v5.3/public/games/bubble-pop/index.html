<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Pop</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="c" aria-label="Bubble Pop game"></canvas><div class="hud"><div class="pill">SCORE <strong id="score">0</strong></div><div class="pill">TIME <strong id="time">30</strong></div></div><section class="panel" id="panel"><h1>BUBBLE<br>POP</h1><p>Pop the bright bubbles before they fade. Smaller bubbles are worth more.</p><button class="primary" id="start">Start popping</button></section></main><script>const c=document.querySelector('#c'),g=c.getContext('2d'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');let w,h,dpr,bubbles=[],run=false,last=0,spawn=0,score=0,left=30,timer;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);function start(){bubbles=[];score=0;left=30;spawn=0;run=true;scoreEl.textContent=0;timeEl.textContent=30;panel.classList.add('hidden');last=performance.now();clearInterval(timer);timer=setInterval(()=>{left--;timeEl.textContent=left;if(left<=0)finish()},1000);requestAnimationFrame(loop)}function finish(){run=false;clearInterval(timer);panel.querySelector('h1').innerHTML='POP<br>OVER';panel.querySelector('p').textContent=`You scored ${score} points.`;panel.querySelector('button').textContent='Pop again';panel.classList.remove('hidden')}function loop(t){if(!run)return;const dt=Math.min((t-last)/1000,.033);last=t;spawn-=dt;if(spawn<=0){const r=18+Math.random()*45;bubbles.push({x:r+Math.random()*(w-r*2),y:h+r,r,vy:50+Math.random()*85,life:5,c:['#5865ff','#ff4fa3','#c8ff45','#ff8a3d','#a879ff'][Math.floor(Math.random()*5)]});spawn=.18+Math.random()*.3}for(const b of bubbles){b.y-=b.vy*dt;b.life-=dt;b.r*=.999}bubbles=bubbles.filter(b=>b.life>0&&b.y>-b.r);draw();requestAnimationFrame(loop)}function draw(){g.fillStyle='#090a12';g.fillRect(0,0,w,h);for(const b of bubbles){g.globalAlpha=Math.min(1,b.life);g.shadowBlur=12;g.shadowColor=b.c;g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(b.x-b.r*.28,b.y-b.r*.28,b.r*.16,0,Math.PI*2);g.fill()}g.globalAlpha=1;g.shadowBlur=0}c.addEventListener('pointerdown',e=>{if(!run)return;for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];if(Math.hypot(e.clientX-b.x,e.clientY-b.y)<=b.r){score+=Math.max(1,Math.round(70-b.r));scoreEl.textContent=score;bubbles.splice(i,1);return}}});document.querySelector('#start').onclick=start;draw();</script></body></html>
