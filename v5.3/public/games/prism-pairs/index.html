<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Prism Pairs</title><link rel="stylesheet" href="../shared/game.css"><style>.board{width:min(700px,calc(100% - 26px));display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;z-index:2}.card{aspect-ratio:1;border:0;background:transparent;perspective:700px;cursor:pointer}.card>span{width:100%;height:100%;display:grid;place-items:center;border-radius:22px;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}.card.flipped>span,.card.matched>span{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;backface-visibility:hidden;border:1px solid rgba(255,255,255,.15)}.back{background:rgba(255,255,255,.1);font-size:2rem}.front{transform:rotateY(180deg);background:var(--color);box-shadow:0 16px 35px color-mix(in srgb,var(--color) 35%,transparent)}.front i{width:42%;aspect-ratio:1;border-radius:28% 72% 62% 38%;background:rgba(255,255,255,.75)}.card.matched{pointer-events:none;opacity:.65}@media(max-width:520px){.board{gap:8px}.face,.card>span{border-radius:15px}}</style></head><body><main class="game"><div class="noise"></div><div class="hud"><div class="pill">MOVES <strong id="moves">0</strong></div><div class="pill">BEST <strong id="best">—</strong></div></div><div class="board hidden" id="board"></div><section class="panel" id="intro"><h1>PRISM<br>PAIRS</h1><p>Find every matching color. Clear the board with the fewest possible flips.</p><button class="primary" id="start">Shuffle tiles</button></section></main><script>
const colors=['#5865ff','#ff4fa3','#c8ff45','#ff8a3d','#a879ff','#32d7c5','#ffd54d','#ff6b6b'];const board=document.querySelector('#board'),intro=document.querySelector('#intro'),movesEl=document.querySelector('#moves'),bestEl=document.querySelector('#best');let open=[],moves=0,locked=false,matched=0,best=Number(localStorage.prismPairsBest||0);bestEl.textContent=best||'—';
function start(){moves=0;matched=0;open=[];locked=false;movesEl.textContent='0';board.innerHTML='';[...colors,...colors].sort(()=>Math.random()-.5).forEach((color,i)=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-label','Hidden color tile');b.dataset.color=color;b.innerHTML=`<span><span class="face back">✦</span><span class="face front" style="--color:${color}"><i></i></span></span>`;b.onclick=()=>flip(b);board.appendChild(b)});intro.classList.add('hidden');board.classList.remove('hidden')}
function flip(card){if(locked||card.classList.contains('flipped')||card.classList.contains('matched'))return;card.classList.add('flipped');open.push(card);if(open.length===2){moves++;movesEl.textContent=moves;locked=true;const[a,b]=open;if(a.dataset.color===b.dataset.color){setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');open=[];locked=false;matched+=2;if(matched===16)finish()},350)}else setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');open=[];locked=false},700)}}
function finish(){if(!best||moves<best){best=moves;localStorage.prismPairsBest=best;bestEl.textContent=best}setTimeout(()=>{board.classList.add('hidden');intro.querySelector('h1').innerHTML='BOARD<br>CLEARED';intro.querySelector('p').textContent=`Solved in ${moves} moves${moves===best?' — a personal best!':''}`;intro.querySelector('button').textContent='Play again';intro.classList.remove('hidden')},500)}document.querySelector('#start').onclick=start;
</script></body></html>
