<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lane Drift</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="c" aria-label="Lane Drift game"></canvas><div class="hud"><div class="pill">DISTANCE <strong id="score">0</strong></div><div class="pill">BEST <strong id="best">0</strong></div></div><section class="panel" id="panel"><h1>LANE<br>DRIFT</h1><p>Switch lanes, dodge traffic, and survive as the road speeds up.</p><button class="primary" id="start">Start engine</button><p class="small">Left / right keys or tap either side</p></section></main><script>const c=document.querySelector('#c'),g=c.getContext('2d'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let w,h,dpr,run=false,last=0,score=0,best=Number(localStorage.laneDriftBest||0),lane=1,target=0,cars=[],spawn=0,speed=280;bestEl.textContent=best;const roadW=()=>Math.min(w*.78,620),laneX=l=>w/2-roadW()/2+roadW()/6+l*roadW()/3;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);target=laneX(lane)}resize();addEventListener('resize',resize);function start(){score=0;lane=1;target=laneX(1);cars=[];spawn=0;speed=280;scoreEl.textContent=0;run=true;panel.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function switchLane(d){if(!run)return;lane=Math.max(0,Math.min(2,lane+d));target=laneX(lane)}function end(){run=false;best=Math.max(best,Math.floor(score));localStorage.laneDriftBest=best;bestEl.textContent=best;panel.querySelector('h1').innerHTML='CAR<br>CRASHED';panel.querySelector('p').textContent=`Distance: ${Math.floor(score)}.`;panel.querySelector('button').textContent='Drive again';panel.classList.remove('hidden')}let carX=0;function loop(t){if(!run)return;const dt=Math.min((t-last)/1000,.03);last=t;speed+=dt*5;score+=dt*speed/25;scoreEl.textContent=Math.floor(score);carX+=(target-carX)*Math.min(1,dt*14);spawn-=dt;if(spawn<=0){const l=Math.floor(Math.random()*3);cars.push({lane:l,x:laneX(l),y:-90,v:speed*(.75+Math.random()*.22),c:['#ff4fa3','#ff8a3d','#a879ff'][Math.floor(Math.random()*3)]});spawn=.45+Math.random()*.45}cars.forEach(o=>{o.y+=o.v*dt;o.x=laneX(o.lane)});cars=cars.filter(o=>o.y<h+100);for(const o of cars)if(Math.abs(o.x-carX)<38&&Math.abs(o.y-(h-120))<72)return end();draw();requestAnimationFrame(loop)}function draw(){const rw=roadW(),left=w/2-rw/2;g.fillStyle='#0b1917';g.fillRect(0,0,w,h);g.fillStyle='#262831';g.fillRect(left,0,rw,h);g.fillStyle='#c8ff45';g.fillRect(left-5,0,5,h);g.fillRect(left+rw,0,5,h);g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=4;g.setLineDash([30,28]);for(let i=1;i<3;i++){g.beginPath();g.moveTo(left+rw*i/3,(-score*4)%58-58);g.lineTo(left+rw*i/3,h);g.stroke()}g.setLineDash([]);function car(x,y,c){g.shadowBlur=12;g.shadowColor=c;g.fillStyle=c;g.fillRect(x-30,y-48,60,96);g.fillStyle='rgba(255,255,255,.65)';g.fillRect(x-20,y-34,40,24)}cars.forEach(o=>car(o.x,o.y,o.c));car(carX||target,h-120,'#5865ff');g.shadowBlur=0}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')switchLane(-1);if(e.key==='ArrowRight'||e.key==='d')switchLane(1)});c.addEventListener('pointerdown',e=>switchLane(e.clientX<w/2?-1:1));document.querySelector('#start').onclick=start;carX=target;draw();</script></body></html>
