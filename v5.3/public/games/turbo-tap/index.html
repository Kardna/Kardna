<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Turbo Tap</title><link rel="stylesheet" href="../shared/game.css"><style>.tap-zone{position:absolute;inset:0;border:0;color:white;background:#111218;display:grid;place-items:center;cursor:pointer;transition:background .15s ease}.tap-zone.wait{background:#ff8a3d}.tap-zone.go{background:#c8ff45;color:#111218}.tap-zone.bad{background:#ff4fa3}.tap-zone h2{font-size:clamp(3rem,14vw,9rem);letter-spacing:-.08em;margin:0}.tap-zone p{margin:8px 0 0;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.results{position:relative;z-index:3}</style></head><body><main class="game"><button class="tap-zone" id="zone"><div><h2 id="word">TURBO TAP</h2><p id="sub">Tap to begin</p></div></button><div class="hud"><div class="pill">LAST <strong id="last">—</strong></div><div class="pill">BEST <strong id="best">—</strong></div></div></main><script>
const zone=document.querySelector('#zone'),word=document.querySelector('#word'),sub=document.querySelector('#sub'),lastEl=document.querySelector('#last'),bestEl=document.querySelector('#best');let state='idle',timer=0,startTime=0,best=Number(localStorage.turboTapBest||0);bestEl.textContent=best?best+'ms':'—';
function reset(){clearTimeout(timer);state='waiting';zone.className='tap-zone wait';word.textContent='WAIT…';sub.textContent='Do not jump early';timer=setTimeout(()=>{state='go';startTime=performance.now();zone.className='tap-zone go';word.textContent='TAP!';sub.textContent='Now now now'},1100+Math.random()*2600)}
zone.onclick=()=>{if(state==='idle'||state==='result'){reset();return}if(state==='waiting'){clearTimeout(timer);state='result';zone.className='tap-zone bad';word.textContent='TOO SOON';sub.textContent='Tap to try again';return}if(state==='go'){const ms=Math.round(performance.now()-startTime);state='result';lastEl.textContent=ms+'ms';if(!best||ms<best){best=ms;localStorage.turboTapBest=best;bestEl.textContent=best+'ms'}zone.className='tap-zone';word.textContent=ms+' ms';sub.textContent=ms<180?'Lightning fast. Tap to retry':ms<260?'Sharp reflexes. Tap to retry':'You can beat that. Tap to retry'}};
</script></body></html>
