<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Goal Rush</title><link rel="stylesheet" href="../shared/game.css"><style>.field{position:absolute;inset:0;background:linear-gradient(#64a65f 0 62%,#489247 62%);display:grid;place-items:center}.field:before{content:"";position:absolute;inset:8% 8% 0;border:3px solid rgba(255,255,255,.36);border-bottom:0}.goal{width:min(680px,84vw);height:min(300px,38vh);border:10px solid white;border-bottom-width:6px;position:relative;background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 18px)}.keeper{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font-size:5rem;transition:left .35s cubic-bezier(.2,.8,.2,1),transform .35s}.ball{position:absolute;left:50%;bottom:-130px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,white 0 40%,#d4d4d4 41%);box-shadow:0 10px 18px rgba(0,0,0,.25);transform:translateX(-50%);transition:all .45s cubic-bezier(.2,.8,.2,1)}.choices{position:absolute;z-index:5;bottom:24px;display:flex;gap:9px}.choices button{min-height:48px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#111218;font-weight:900;cursor:pointer}.message{position:absolute;z-index:6;top:90px;font-size:clamp(2rem,8vw,5rem);font-weight:900;letter-spacing:-.06em;text-shadow:0 5px 25px rgba(0,0,0,.22)}@media(max-width:520px){.keeper{font-size:3.8rem}.ball{width:50px;height:50px}.choices button{padding:0 14px}}</style></head><body><main class="game"><div class="field"><div class="goal"><div class="keeper" id="keeper">🧤</div><div class="ball" id="ball"></div></div><div class="message" id="message"></div><div class="choices hidden" id="choices"><button data-dir="left">Left</button><button data-dir="center">Center</button><button data-dir="right">Right</button></div></div><div class="hud"><div class="pill">GOALS <strong id="score">0</strong></div><div class="pill">SHOTS <strong id="shots">0/5</strong></div></div><section class="panel" id="intro"><h1>GOAL<br>RUSH</h1><p>Choose a side and beat the keeper. You get five penalties—make them count.</p><button class="primary" id="start">Take penalties</button></section></main><script>
const intro=document.querySelector('#intro'),choices=document.querySelector('#choices'),keeper=document.querySelector('#keeper'),ball=document.querySelector('#ball'),message=document.querySelector('#message'),scoreEl=document.querySelector('#score'),shotsEl=document.querySelector('#shots');let score=0,shots=0,busy=false;const positions={left:'20%',center:'50%',right:'80%'};
function start(){score=0;shots=0;scoreEl.textContent=0;shotsEl.textContent='0/5';message.textContent='';intro.classList.add('hidden');choices.classList.remove('hidden');resetObjects()}document.querySelector('#start').onclick=start;
function resetObjects(){ball.style.left='50%';ball.style.bottom='-130px';ball.style.transform='translateX(-50%) scale(1)';keeper.style.left='50%';keeper.style.transform='translateX(-50%) rotate(0)'}
choices.onclick=e=>{const b=e.target.closest('button');if(!b||busy)return;busy=true;const pick=b.dataset.dir,save=['left','center','right'][Math.floor(Math.random()*3)];shots++;shotsEl.textContent=`${shots}/5`;keeper.style.left=positions[save];keeper.style.transform='translateX(-50%) rotate('+(save==='left'?-18:save==='right'?18:0)+'deg)';ball.style.left=positions[pick];ball.style.bottom='55%';ball.style.transform='translateX(-50%) scale(.55)';const goal=pick!==save;if(goal){score++;scoreEl.textContent=score;message.textContent='GOAL!';message.style.color='#c8ff45'}else{message.textContent='SAVED';message.style.color='white'}setTimeout(()=>{message.textContent='';if(shots>=5){choices.classList.add('hidden');intro.querySelector('h1').innerHTML=score>=4?'TOP<br>BINS':score>=2?'GOOD<br>ROUND':'RUN<br>IT BACK';intro.querySelector('p').textContent=`You scored ${score} out of 5 penalties.`;intro.querySelector('button').textContent='Shoot again';intro.classList.remove('hidden')}else{resetObjects();busy=false}},900)};
</script></body></html>
