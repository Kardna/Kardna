<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Connect Four</title><link rel="stylesheet" href="../shared/game.css"><style>.connect{position:relative;z-index:2;width:min(690px,calc(100% - 24px));display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:16px;border-radius:30px;background:#5865ff;box-shadow:0 28px 70px rgba(0,0,0,.35)}.slot{aspect-ratio:1;border:0;border-radius:50%;background:#101119;cursor:pointer;box-shadow:inset 0 8px 15px rgba(0,0,0,.45)}.slot.p1{background:var(--lime)}.slot.p2{background:var(--pink)}.slot.win{outline:5px solid #fff;outline-offset:-7px}@media(max-width:520px){.connect{gap:4px;padding:9px;border-radius:20px}}</style></head><body><main class="game"><div class="noise"></div><div class="hud"><div class="pill">PLAYER <strong id="player">1</strong></div><div class="pill">GOAL <strong>4</strong></div></div><div class="connect hidden" id="board" aria-label="Connect Four board"></div><section class="panel" id="panel"><h1>CONNECT<br>FOUR</h1><p>Two players, one device. Drop a disc and connect four in any direction.</p><button class="primary" id="start">Start match</button></section></main><script>const board=document.querySelector('#board'),panel=document.querySelector('#panel'),playerEl=document.querySelector('#player');let grid,player,over;function start(){grid=Array.from({length:6},()=>Array(7).fill(0));player=1;over=false;playerEl.textContent=1;board.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<7;c++){const b=document.createElement('button');b.className='slot';b.dataset.r=r;b.dataset.c=c;b.setAttribute('aria-label',`Row ${r+1}, column ${c+1}`);b.onclick=()=>drop(c);board.appendChild(b)}panel.classList.add('hidden');board.classList.remove('hidden')}function drop(c){if(over)return;let r=5;while(r>=0&&grid[r][c])r--;if(r<0)return;grid[r][c]=player;paint();const line=winner(r,c,player);if(line){over=true;line.forEach(([rr,cc])=>board.children[rr*7+cc].classList.add('win'));setTimeout(()=>finish(`PLAYER ${player} WINS`),700);return}if(grid.flat().every(Boolean)){over=true;setTimeout(()=>finish('DRAW'),500);return}player=player===1?2:1;playerEl.textContent=player}function paint(){grid.forEach((row,r)=>row.forEach((v,c)=>{const b=board.children[r*7+c];b.className='slot'+(v?` p${v}`:'')}))}function winner(r,c,p){for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const line=[[r,c]];for(const s of [-1,1])for(let n=1;n<4;n++){const rr=r+dr*n*s,cc=c+dc*n*s;if(rr>=0&&rr<6&&cc>=0&&cc<7&&grid[rr][cc]===p)line.push([rr,cc]);else break}if(line.length>=4)return line}return null}function finish(t){board.classList.add('hidden');panel.querySelector('h1').textContent=t;panel.querySelector('p').textContent='Drop another set and run it back.';panel.querySelector('button').textContent='Rematch';panel.classList.remove('hidden')}document.querySelector('#start').onclick=start;</script></body></html>
