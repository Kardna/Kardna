<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Minefield Mini</title><link rel="stylesheet" href="../shared/game.css"><style>.mine-board{position:relative;z-index:2;width:min(620px,calc(100% - 24px));display:grid;grid-template-columns:repeat(10,1fr);gap:5px;touch-action:manipulation}.mine-cell{aspect-ratio:1;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.09);color:#fff;font-weight:900;font-size:clamp(.65rem,2.4vw,1.05rem);cursor:pointer}.mine-cell.open{background:rgba(255,255,255,.2)}.mine-cell.flag{color:var(--orange)}.mine-cell[data-n="1"]{color:#8da0ff}.mine-cell[data-n="2"]{color:var(--lime)}.mine-cell[data-n="3"]{color:#ff7ab6}.mine-cell[data-n="4"]{color:#c7a8ff}@media(max-width:520px){.mine-board{gap:3px}.mine-cell{border-radius:6px}}</style></head><body><main class="game"><div class="noise"></div><div class="hud"><div class="pill">MINES <strong id="mines">14</strong></div><div class="pill">TIME <strong id="time">0</strong></div></div><div class="mine-board hidden" id="board" role="grid" aria-label="Minefield"></div><section class="panel" id="panel"><h1>MINEFIELD<br>MINI</h1><p>Reveal every safe square. Right-click or hold to place a flag.</p><button class="primary" id="start">Generate field</button></section></main><script>const board=document.querySelector('#board'),panel=document.querySelector('#panel'),minesEl=document.querySelector('#mines'),timeEl=document.querySelector('#time');const N=10,M=14;let cells=[],first=true,over=false,startAt=0,timer;function neighbors(i){const r=Math.floor(i/N),c=i%N,a=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){const rr=r+y,cc=c+x;if((x||y)&&rr>=0&&cc>=0&&rr<N&&cc<N)a.push(rr*N+cc)}return a}function start(){clearInterval(timer);cells=Array.from({length:N*N},()=>({mine:false,revealed:false,flag:false,count:0}));first=true;over=false;startAt=Date.now();timeEl.textContent=0;minesEl.textContent=M;board.innerHTML='';cells.forEach((_,i)=>{const b=document.createElement('button');b.className='mine-cell';b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Hidden square ${i+1}`);let hold;b.onpointerdown=()=>hold=setTimeout(()=>flag(i),500);b.onpointerup=()=>clearTimeout(hold);b.onpointerleave=()=>clearTimeout(hold);b.onclick=()=>reveal(i);b.oncontextmenu=e=>{e.preventDefault();flag(i)};board.appendChild(b)});panel.classList.add('hidden');board.classList.remove('hidden');timer=setInterval(()=>timeEl.textContent=Math.floor((Date.now()-startAt)/1000),1000)}function seed(safe){const forbidden=new Set([safe,...neighbors(safe)]);let placed=0;while(placed<M){const i=Math.floor(Math.random()*cells.length);if(!forbidden.has(i)&&!cells[i].mine){cells[i].mine=true;placed++}}cells.forEach((c,i)=>c.count=neighbors(i).filter(n=>cells[n].mine).length)}function flag(i){if(over||cells[i].revealed)return;cells[i].flag=!cells[i].flag;paint(i);minesEl.textContent=M-cells.filter(c=>c.flag).length}function reveal(i){if(over||cells[i].flag||cells[i].revealed)return;if(first){seed(i);first=false}const c=cells[i];c.revealed=true;paint(i);if(c.mine)return finish(false);if(c.count===0)neighbors(i).forEach(reveal);if(cells.filter(c=>!c.mine).every(c=>c.revealed))finish(true)}function paint(i){const c=cells[i],b=board.children[i];b.className='mine-cell'+(c.revealed?' open':'')+(c.flag?' flag':'');b.textContent=c.flag?'⚑':c.revealed?(c.mine?'✹':c.count||''):'';if(c.revealed&&c.count)b.dataset.n=c.count}function finish(win){over=true;clearInterval(timer);cells.forEach((c,i)=>{if(c.mine){c.revealed=true;paint(i)}});setTimeout(()=>{board.classList.add('hidden');panel.querySelector('h1').innerHTML=win?'FIELD<br>CLEARED':'BOOM';panel.querySelector('p').textContent=win?`Cleared in ${timeEl.textContent} seconds.`:'That square was hiding a mine.';panel.querySelector('button').textContent='New field';panel.classList.remove('hidden')},500)}document.querySelector('#start').onclick=start;</script></body></html>
