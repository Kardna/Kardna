<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pixel Stack</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="canvas" aria-label="Pixel Stack game canvas"></canvas><div class="hud"><div class="pill">HEIGHT <strong id="score">0</strong></div><div class="pill">BEST <strong id="best">0</strong></div></div><section class="panel" id="intro"><h1>PIXEL<br>STACK</h1><p>Drop each moving block on top of the tower. Miss the overlap and the tower gets narrower.</p><button class="primary" id="start">Build tower</button><p class="small">Space / click / tap to drop</p></section></main><script>
const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),intro=document.querySelector('#intro'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let w,h,dpr,running=false,last=0,blocks=[],current=null,level=0,best=Number(localStorage.pixelStackBest||0),camera=0;bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
function start(){running=true;level=0;camera=0;blocks=[{x:w/2-110,y:h-90,w:220,h:34,color:'#5865ff'}];spawn();scoreEl.textContent=0;intro.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}document.querySelector('#start').onclick=start;
function spawn(){const base=blocks[blocks.length-1];current={x:0,y:base.y-42,w:base.w,h:34,vx:190+level*8,color:['#ff4fa3','#c8ff45','#ff8a3d','#a879ff','#5865ff'][level%5]}}
function drop(){if(!running){start();return}if(!current)return;const base=blocks[blocks.length-1],left=Math.max(current.x,base.x),right=Math.min(current.x+current.w,base.x+base.w),overlap=right-left;if(overlap<=3){finish();return}current.x=left;current.w=overlap;blocks.push({...current});current=null;level++;scoreEl.textContent=level;if(blocks[blocks.length-1].y< h*.4)camera+=42;spawn()}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop()}});addEventListener('pointerdown',e=>{if(e.target.closest?.('button'))return;drop()});
function finish(){running=false;best=Math.max(best,level);localStorage.pixelStackBest=best;bestEl.textContent=best;intro.querySelector('h1').innerHTML='TOWER<br>FELL';intro.querySelector('p').textContent=`You stacked ${level} blocks before missing the edge.`;intro.querySelector('button').textContent='Build again';intro.classList.remove('hidden')}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.033);last=now;if(current){current.x+=current.vx*dt;if(current.x<0){current.x=0;current.vx=Math.abs(current.vx)}if(current.x+current.w>w){current.x=w-current.w;current.vx=-Math.abs(current.vx)}}ctx.fillStyle='#101118';ctx.fillRect(0,0,w,h);const grd=ctx.createRadialGradient(w/2,h*.65,30,w/2,h*.65,w*.65);grd.addColorStop(0,'rgba(88,101,255,.24)');grd.addColorStop(1,'transparent');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);for(let i=0;i<blocks.length;i++){const b=blocks[i],y=b.y+camera;ctx.shadowBlur=12;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.fillRect(b.x,y,b.w,b.h)}if(current){const y=current.y+camera;ctx.shadowBlur=12;ctx.shadowColor=current.color;ctx.fillStyle=current.color;ctx.fillRect(current.x,y,current.w,current.h)}ctx.shadowBlur=0;requestAnimationFrame(loop)}
</script></body></html>
