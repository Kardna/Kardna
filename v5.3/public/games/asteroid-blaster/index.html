<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Asteroid Blaster</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="c" aria-label="Asteroid Blaster game"></canvas><div class="hud"><div class="pill">SCORE <strong id="score">0</strong></div><div class="pill">HULL <strong id="lives">3</strong></div></div><section class="panel" id="panel"><h1>ASTEROID<br>BLASTER</h1><p>Move, aim upward, and fire through the rock field.</p><button class="primary" id="start">Launch</button><p class="small">WASD / arrows + Space, or drag and tap</p></section></main><script>const c=document.querySelector('#c'),g=c.getContext('2d'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives');let w,h,dpr,run=false,last=0,score=0,lives=3,rocks=[],shots=[],spawn=0,cool=0,keys={};const ship={x:0,y:0,r:17,target:0};function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);ship.y=h-70;if(!ship.x)ship.x=ship.target=w/2}resize();addEventListener('resize',resize);function start(){score=0;lives=3;rocks=[];shots=[];spawn=0;cool=0;ship.x=ship.target=w/2;scoreEl.textContent=0;livesEl.textContent=3;run=true;panel.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function shoot(){if(!run||cool>0)return;shots.push({x:ship.x,y:ship.y-25});cool=.16}function end(){run=false;panel.querySelector('h1').innerHTML='HULL<br>LOST';panel.querySelector('p').textContent=`Final score: ${score}.`;panel.querySelector('button').textContent='Launch again';panel.classList.remove('hidden')}function loop(t){if(!run)return;const dt=Math.min((t-last)/1000,.03);last=t;cool-=dt;if(keys.ArrowLeft||keys.a)ship.target-=430*dt;if(keys.ArrowRight||keys.d)ship.target+=430*dt;if(keys[' ']||keys.Space)shoot();ship.target=Math.max(25,Math.min(w-25,ship.target));ship.x+=(ship.target-ship.x)*Math.min(1,dt*13);spawn-=dt;if(spawn<=0){const r=14+Math.random()*30;rocks.push({x:r+Math.random()*(w-r*2),y:-50,r,vy:100+Math.random()*150+score*.6,hp:r>32?2:1});spawn=Math.max(.18,.62-score/650)+Math.random()*.25}shots.forEach(s=>s.y-=620*dt);rocks.forEach(r=>r.y+=r.vy*dt);for(const s of shots)for(const r of rocks)if(r.hp>0&&Math.hypot(s.x-r.x,s.y-r.y)<r.r+4){s.y=-100;r.hp--;if(r.hp<=0){score+=10;scoreEl.textContent=score}}rocks=rocks.filter(r=>{if(r.hp<=0)return false;if(r.y>h+50){lives--;livesEl.textContent=lives;if(lives<=0)end();return false}if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+ship.r){lives--;livesEl.textContent=lives;if(lives<=0)end();return false}return true});shots=shots.filter(s=>s.y>-30);draw();if(run)requestAnimationFrame(loop)}function draw(){g.fillStyle='#070810';g.fillRect(0,0,w,h);for(let i=0;i<80;i++){g.fillStyle='rgba(255,255,255,.35)';g.fillRect((i*97)%w,(i*61+score)%h,1,1)}g.shadowBlur=12;g.shadowColor='#c8ff45';g.fillStyle='#c8ff45';shots.forEach(s=>g.fillRect(s.x-2,s.y-10,4,16));g.save();g.translate(ship.x,ship.y);g.fillStyle='#5865ff';g.beginPath();g.moveTo(0,-24);g.lineTo(18,19);g.lineTo(0,12);g.lineTo(-18,19);g.closePath();g.fill();g.restore();for(const r of rocks){g.shadowColor='#ff4fa3';g.fillStyle=r.hp===2?'#a879ff':'#ff4fa3';g.beginPath();g.arc(r.x,r.y,r.r,0,Math.PI*2);g.fill()}g.shadowBlur=0}addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('pointermove',e=>ship.target=e.clientX);c.addEventListener('pointerdown',e=>{ship.target=e.clientX;shoot()});document.querySelector('#start').onclick=start;draw();</script></body></html>
