<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lights Out</title><link rel="stylesheet" href="../shared/game.css"><style>.lights{position:relative;z-index:2;width:min(560px,calc(100% - 30px));display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.light{aspect-ratio:1;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:rgba(255,255,255,.055);cursor:pointer;transition:transform .15s ease,background .2s ease,box-shadow .2s ease}.light:active{transform:scale(.92)}.light.on{background:var(--lime);box-shadow:0 0 35px rgba(200,255,69,.38)}@media(max-width:520px){.lights{gap:6px}.light{border-radius:14px}}</style></head><body><main class="game"><div class="noise"></div><div class="hud"><div class="pill">MOVES <strong id="moves">0</strong></div><div class="pill">LIGHTS <strong id="left">0</strong></div></div><div class="lights hidden" id="board"></div><section class="panel" id="panel"><h1>LIGHTS<br>OUT</h1><p>Tap a tile to toggle it and its neighbors. Turn the whole board dark.</p><button class="primary" id="start">Scramble board</button></section></main><script>const board=document.querySelector('#board'),panel=document.querySelector('#panel'),movesEl=document.querySelector('#moves'),leftEl=document.querySelector('#left');let s,moves,locked;const N=5;function around(i){const r=Math.floor(i/N),c=i%N;return [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N).map(([a,b])=>a*N+b)}function toggle(i,paintNow=true){around(i).forEach(n=>s[n]=!s[n]);if(paintNow)paint()}function start(){s=Array(N*N).fill(false);moves=0;locked=false;for(let i=0;i<10;i++)toggle(Math.floor(Math.random()*s.length),false);if(!s.some(Boolean))toggle(12,false);board.innerHTML='';s.forEach((_,i)=>{const b=document.createElement('button');b.className='light';b.setAttribute('aria-label',`Light ${i+1}`);b.onclick=()=>play(i);board.appendChild(b)});movesEl.textContent=0;paint();panel.classList.add('hidden');board.classList.remove('hidden')}function play(i){if(locked)return;moves++;movesEl.textContent=moves;toggle(i);if(!s.some(Boolean)){locked=true;setTimeout(()=>{board.classList.add('hidden');panel.querySelector('h1').innerHTML='ALL<br>DARK';panel.querySelector('p').textContent=`Solved in ${moves} moves.`;panel.querySelector('button').textContent='New puzzle';panel.classList.remove('hidden')},450)}}function paint(){s.forEach((v,i)=>board.children[i]?.classList.toggle('on',v));leftEl.textContent=s.filter(Boolean).length}document.querySelector('#start').onclick=start;</script></body></html>
