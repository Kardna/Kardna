<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Typing Rush</title><link rel="stylesheet" href="../shared/game.css"><style>.typing{position:relative;z-index:2;width:min(760px,calc(100% - 28px));text-align:center}.typing>p{margin:0 0 28px;font-size:clamp(4rem,15vw,10rem);line-height:.8;font-weight:900;letter-spacing:-.075em;color:var(--lime);text-shadow:0 0 55px rgba(200,255,69,.25)}.typing input{width:min(520px,100%);height:66px;border:2px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;text-align:center;font-size:1.4rem;font-weight:800;outline:0}.typing input:focus{border-color:#5865ff}.typing input.bad{border-color:#ff4fa3}.typing span{display:block;margin-top:16px;color:#b9bac2}</style></head><body><main class="game"><div class="noise"></div><div class="hud"><div class="pill">TIME <strong id="time">45</strong></div><div class="pill">WPM <strong id="wpm">0</strong></div></div><section class="typing hidden" id="play"><p id="word">ready</p><input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the shown word"><span id="status">Type the word and press space or Enter.</span></section><section class="panel" id="panel"><h1>TYPING<br>RUSH</h1><p>Type as many words as possible before the clock hits zero.</p><button class="primary" id="start">Start typing</button></section></main><script>const words='pixel turbo orbit prism arcade browser keyboard neon quick jump level game spark drift score paddle puzzle rocket cloud laser comet hyper speed maze block flash duck slope runner classic color race moon star shift brick'.split(' '),panel=document.querySelector('#panel'),play=document.querySelector('#play'),wordEl=document.querySelector('#word'),input=document.querySelector('#input'),timeEl=document.querySelector('#time'),wpmEl=document.querySelector('#wpm'),status=document.querySelector('#status');let current='',correct=0,left=45,timer,run=false;function next(){current=words[Math.floor(Math.random()*words.length)];wordEl.textContent=current;input.value=''}function start(){correct=0;left=45;run=true;timeEl.textContent=left;wpmEl.textContent=0;status.textContent='Go.';panel.classList.add('hidden');play.classList.remove('hidden');next();setTimeout(()=>input.focus(),50);clearInterval(timer);timer=setInterval(()=>{left--;timeEl.textContent=left;wpmEl.textContent=Math.round(correct/(Math.max(1,45-left)/60));if(left<=0)finish()},1000)}function submit(){if(!run)return;if(input.value.trim().toLowerCase()===current){correct++;status.textContent='Nice.';next()}else{status.textContent='Not quite — keep typing.';input.classList.add('bad');setTimeout(()=>input.classList.remove('bad'),180)}}function finish(){run=false;clearInterval(timer);play.classList.add('hidden');const wpm=Math.round(correct/(45/60));panel.querySelector('h1').innerHTML='TIME<br>UP';panel.querySelector('p').textContent=`${correct} words correct — ${wpm} WPM.`;panel.querySelector('button').textContent='Run again';panel.classList.remove('hidden')}input.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();submit()}});document.querySelector('#start').onclick=start;</script></body></html>
