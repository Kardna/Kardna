<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tic-Tac Glow</title><link rel="stylesheet" href="../shared/game.css"><style>.ttt{position:relative;z-index:2;width:min(520px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ttt-cell{aspect-ratio:1;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(255,255,255,.08);color:#fff;font-size:clamp(3rem,12vw,7rem);font-weight:900;cursor:pointer}.ttt-cell.X{color:var(--lime);text-shadow:0 0 35px rgba(200,255,69,.45)}.ttt-cell.O{color:var(--pink);text-shadow:0 0 35px rgba(255,79,163,.45)}.ttt-cell.win{background:rgba(88,101,255,.35)}</style></head><body><main class="game"><div class="noise"></div><div class="hud"><div class="pill">YOU <strong>X</strong></div><div class="pill">TURN <strong id="turn">YOU</strong></div></div><div class="ttt hidden" id="board" role="grid"></div><section class="panel" id="panel"><h1>TIC-TAC<br>GLOW</h1><p>Play X against Kardna. The AI blocks wins and takes its chances.</p><button class="primary" id="start">Make a move</button></section></main><script>const board=document.querySelector('#board'),panel=document.querySelector('#panel'),turnEl=document.querySelector('#turn');let s,over;const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function win(p){return lines.find(l=>l.every(i=>s[i]===p))}function start(){s=Array(9).fill('');over=false;turnEl.textContent='YOU';board.innerHTML='';s.forEach((_,i)=>{const b=document.createElement('button');b.className='ttt-cell';b.setAttribute('aria-label',`Cell ${i+1}`);b.onclick=()=>move(i);board.appendChild(b)});panel.classList.add('hidden');board.classList.remove('hidden')}function move(i){if(over||s[i])return;s[i]='X';paint();if(check('X'))return;turnEl.textContent='CPU';setTimeout(ai,300)}function ai(){if(over)return;const empty=s.map((v,i)=>v?'':i).filter(v=>v!=='');let pick;for(const p of ['O','X']){pick=empty.find(i=>{s[i]=p;const yes=!!win(p);s[i]='';return yes});if(pick!==undefined)break}if(pick===undefined&&s[4]==='')pick=4;if(pick===undefined){const corners=empty.filter(i=>[0,2,6,8].includes(i));pick=(corners.length?corners:empty)[Math.floor(Math.random()*(corners.length?corners.length:empty.length))]}if(pick!==undefined)s[pick]='O';paint();if(!check('O'))turnEl.textContent='YOU'}function paint(){[...board.children].forEach((b,i)=>{b.textContent=s[i];b.className='ttt-cell '+(s[i]||'')})}function check(p){const line=win(p);if(line){over=true;line.forEach(i=>board.children[i].classList.add('win'));setTimeout(()=>finish(p==='X'?'YOU WIN':'CPU WINS'),650);return true}if(s.every(Boolean)){over=true;setTimeout(()=>finish('DRAW'),500);return true}return false}function finish(title){board.classList.add('hidden');panel.querySelector('h1').textContent=title;panel.querySelector('p').textContent=title==='YOU WIN'?'Clean line. Kardna got caught.':title==='DRAW'?'Nobody gave up a line.':'The bot found the opening.';panel.querySelector('button').textContent='Play again';panel.classList.remove('hidden')}document.querySelector('#start').onclick=start;</script></body></html>
