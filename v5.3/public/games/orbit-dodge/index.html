<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Orbit Dodge</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="canvas" aria-label="Orbit Dodge game canvas"></canvas><div class="hud"><div class="pill">SCORE <strong id="score">0</strong></div><div class="pill">SHIELDS <strong id="lives">3</strong></div></div><section class="panel" id="intro"><h1>ORBIT<br>DODGE</h1><p>Move with your mouse, finger, or arrow keys. Dodge the meteors and keep all three shields online.</p><button class="primary" id="start">Launch ship</button></section></main><script>
const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),intro=document.querySelector('#intro'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives');let w,h,dpr,running=false,last=0,score=0,lives=3,rocks=[],spawn=0,keys={};const ship={x:0,y:0,r:18,targetX:0};
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ship.y=h-85;if(!ship.x)ship.x=ship.targetX=w/2}resize();addEventListener('resize',resize);
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});c.addEventListener('pointermove',e=>ship.targetX=e.clientX);c.addEventListener('pointerdown',e=>ship.targetX=e.clientX);
function start(){running=true;score=0;lives=3;rocks=[];spawn=0;ship.x=ship.targetX=w/2;scoreEl.textContent='0';livesEl.textContent='3';intro.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}document.querySelector('#start').onclick=start;
function hit(){lives--;livesEl.textContent=lives;document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),200);if(lives<=0){running=false;intro.querySelector('h1').innerHTML='MISSION<br>OVER';intro.querySelector('p').textContent=`You survived for ${Math.floor(score)} points.`;intro.querySelector('button').textContent='Launch again';intro.classList.remove('hidden')}}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.033);last=now;score+=dt*12;scoreEl.textContent=Math.floor(score);if(keys.ArrowLeft||keys.a)ship.targetX-=380*dt;if(keys.ArrowRight||keys.d)ship.targetX+=380*dt;ship.targetX=Math.max(28,Math.min(w-28,ship.targetX));ship.x+=(ship.targetX-ship.x)*Math.min(1,dt*10);spawn-=dt;if(spawn<=0){const r=12+Math.random()*26;rocks.push({x:r+Math.random()*(w-r*2),y:-50,r,vy:170+Math.random()*180+score*1.4,spin:Math.random()*6});spawn=Math.max(.16,.7-score/350)+Math.random()*.35}
for(const rock of rocks){rock.y+=rock.vy*dt;rock.spin+=dt*2;if(Math.hypot(rock.x-ship.x,rock.y-ship.y)<rock.r+ship.r){rock.y=h+100;hit();if(!running)return}}rocks=rocks.filter(r=>r.y<h+80);ctx.fillStyle='#090a12';ctx.fillRect(0,0,w,h);for(let i=0;i<90;i++){const x=(i*83)%w,y=(i*137+score*14)%h;ctx.fillStyle=`rgba(255,255,255,${.18+(i%4)*.12})`;ctx.fillRect(x,y,1.4,1.4)}ctx.strokeStyle='rgba(88,101,255,.18)';ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*.36,0,Math.PI*2);ctx.stroke();ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowBlur=12;ctx.shadowColor='#c8ff45';ctx.fillStyle='#c8ff45';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(20,20);ctx.lineTo(0,12);ctx.lineTo(-20,20);ctx.closePath();ctx.fill();ctx.restore();for(const rock of rocks){ctx.save();ctx.translate(rock.x,rock.y);ctx.rotate(rock.spin);ctx.shadowBlur=12;ctx.shadowColor='#ff4fa3';ctx.fillStyle='#a879ff';ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2,rr=rock.r*(.72+Math.random()*.2);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}requestAnimationFrame(loop)}
</script></body></html>
