<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Maze Sprint</title><link rel="stylesheet" href="../shared/game.css"><style>.dpad{position:absolute;z-index:5;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,48px);grid-template-areas:". up ." "left down right";gap:6px}.dpad button{height:48px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(17,18,24,.78);color:#fff;font-size:1.15rem}.dpad button:nth-child(1){grid-area:up}.dpad button:nth-child(2){grid-area:left}.dpad button:nth-child(3){grid-area:down}.dpad button:nth-child(4){grid-area:right}@media(min-width:800px){.dpad{opacity:.45}}</style></head><body><main class="game"><canvas id="c" aria-label="Maze Sprint game"></canvas><div class="hud"><div class="pill">MOVES <strong id="moves">0</strong></div><div class="pill">BEST <strong id="best">—</strong></div></div><div class="dpad hidden" id="dpad"><button data-d="0,-1">↑</button><button data-d="-1,0">←</button><button data-d="0,1">↓</button><button data-d="1,0">→</button></div><section class="panel" id="panel"><h1>MAZE<br>SPRINT</h1><p>Find the lime exit. Every round generates a completely new maze.</p><button class="primary" id="start">Generate maze</button><p class="small">Arrow keys / WASD / swipe / buttons</p></section></main><script>const c=document.querySelector('#c'),g=c.getContext('2d'),panel=document.querySelector('#panel'),dpad=document.querySelector('#dpad'),movesEl=document.querySelector('#moves'),bestEl=document.querySelector('#best');const N=17;let maze,pos,moves,best=Number(localStorage.mazeSprintBest||0),sx=0,sy=0;bestEl.textContent=best||'—';function make(){maze=Array.from({length:N*N},()=>({v:false,w:[1,1,1,1]}));const stack=[0];maze[0].v=true;while(stack.length){const i=stack.at(-1),r=Math.floor(i/N),c=i%N,opts=[];if(r>0&&!maze[i-N].v)opts.push([i-N,0,2]);if(c<N-1&&!maze[i+1].v)opts.push([i+1,1,3]);if(r<N-1&&!maze[i+N].v)opts.push([i+N,2,0]);if(c>0&&!maze[i-1].v)opts.push([i-1,3,1]);if(!opts.length){stack.pop();continue}const [n,a,b]=opts[Math.floor(Math.random()*opts.length)];maze[i].w[a]=0;maze[n].w[b]=0;maze[n].v=true;stack.push(n)}}function start(){make();pos=0;moves=0;movesEl.textContent=0;panel.classList.add('hidden');dpad.classList.remove('hidden');draw()}function move(dx,dy){const r=Math.floor(pos/N),col=pos%N;let side=-1,n=pos;if(dy<0){side=0;n-=N}if(dx>0){side=1;n++}if(dy>0){side=2;n+=N}if(dx<0){side=3;n--}if(side<0||maze[pos].w[side])return;if(n<0||n>=N*N)return;pos=n;moves++;movesEl.textContent=moves;draw();if(pos===N*N-1)finish()}function draw(){const d=Math.min(devicePixelRatio||1,1.5),pad=30,size=Math.min((innerWidth-pad*2)/N,(innerHeight-pad*2)/N),bw=size*N,ox=(innerWidth-bw)/2,oy=(innerHeight-bw)/2;c.width=innerWidth*d;c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0);g.fillStyle='#090a12';g.fillRect(0,0,innerWidth,innerHeight);g.lineWidth=Math.max(2,size*.08);g.strokeStyle='rgba(255,255,255,.5)';maze.forEach((cell,i)=>{const r=Math.floor(i/N),col=i%N,x=ox+col*size,y=oy+r*size;g.beginPath();if(cell.w[0]){g.moveTo(x,y);g.lineTo(x+size,y)}if(cell.w[1]){g.moveTo(x+size,y);g.lineTo(x+size,y+size)}if(cell.w[2]){g.moveTo(x,y+size);g.lineTo(x+size,y+size)}if(cell.w[3]){g.moveTo(x,y);g.lineTo(x,y+size)}g.stroke()});g.fillStyle='#c8ff45';g.fillRect(ox+(N-1)*size+size*.25,oy+(N-1)*size+size*.25,size*.5,size*.5);const r=Math.floor(pos/N),col=pos%N;g.shadowBlur=12;g.shadowColor='#ff4fa3';g.fillStyle='#ff4fa3';g.beginPath();g.arc(ox+col*size+size/2,oy+r*size+size/2,size*.28,0,Math.PI*2);g.fill();g.shadowBlur=0}function finish(){best=!best?moves:Math.min(best,moves);localStorage.mazeSprintBest=best;bestEl.textContent=best;setTimeout(()=>{dpad.classList.add('hidden');panel.querySelector('h1').innerHTML='MAZE<br>CLEARED';panel.querySelector('p').textContent=`Escaped in ${moves} moves.`;panel.querySelector('button').textContent='New maze';panel.classList.remove('hidden')},300)}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1);if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0)});c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))});dpad.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.d.split(',').map(Number);move(x,y)});document.querySelector('#start').onclick=start;addEventListener('resize',()=>maze&&draw());</script></body></html>
