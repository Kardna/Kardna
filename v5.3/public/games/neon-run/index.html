<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Neon Run</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game" id="game"><div class="noise"></div><canvas id="canvas" aria-label="Neon Run game canvas"></canvas><div class="hud"><div class="pill">DISTANCE <strong id="score">0</strong></div><div class="pill">BEST <strong id="best">0</strong></div></div><section class="panel" id="intro"><h1>NEON<br>RUN</h1><p>Jump over the glowing blocks. Press Space, tap, or click. The track keeps getting faster.</p><button class="primary" id="start">Start running</button><p class="small">Space / click / tap to jump</p></section></main><script>
const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),intro=document.querySelector('#intro'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let w=0,h=0,dpr=1,running=false,last=0,speed=430,score=0,best=Number(localStorage.neonRunBest||0),spawn=0,obstacles=[];const player={x:110,y:0,vy:0,size:34,onGround:true};bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.y=h-105-player.size}addEventListener('resize',resize);resize();
function jump(){if(!running){start();return}if(player.onGround){player.vy=-730;player.onGround=false}}
function start(){running=true;score=0;speed=430;spawn=0;obstacles=[];player.vy=0;player.y=h-105-player.size;player.onGround=true;intro.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
document.querySelector('#start').onclick=start;addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});addEventListener('pointerdown',e=>{if(e.target.closest?.('button'))return;jump()});
function reset(){running=false;best=Math.max(best,Math.floor(score));localStorage.neonRunBest=best;bestEl.textContent=best;intro.querySelector('h1').innerHTML='RUN<br>OVER';intro.querySelector('p').textContent=`You made it ${Math.floor(score)} meters. The city is still moving.`;intro.querySelector('button').textContent='Run again';intro.classList.remove('hidden')}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.032);last=now;speed+=dt*9;score+=dt*speed/18;scoreEl.textContent=Math.floor(score);spawn-=dt;if(spawn<=0){const height=32+Math.random()*52;obstacles.push({x:w+60,y:h-105-height,w:28+Math.random()*28,h:height});spawn=.78+Math.random()*.72-speed/1600}
player.vy+=1900*dt;player.y+=player.vy*dt;const ground=h-105-player.size;if(player.y>=ground){player.y=ground;player.vy=0;player.onGround=true}for(const o of obstacles)o.x-=speed*dt;obstacles=obstacles.filter(o=>o.x+o.w>-20);for(const o of obstacles){if(player.x+player.size-7>o.x&&player.x+7<o.x+o.w&&player.y+player.size-5>o.y){reset();return}}
ctx.clearRect(0,0,w,h);const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#15162a');g.addColorStop(1,'#090a0e');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(88,101,255,.22)';ctx.lineWidth=1;for(let x=(-score*8)%48;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=50;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#1e2030';ctx.fillRect(0,h-105,w,105);ctx.fillStyle='#5865ff';ctx.fillRect(0,h-105,w,5);ctx.shadowBlur=12;ctx.shadowColor='#c8ff45';ctx.fillStyle='#c8ff45';ctx.fillRect(player.x,player.y,player.size,player.size);ctx.shadowBlur=0;for(const o of obstacles){ctx.shadowBlur=12;ctx.shadowColor='#ff4fa3';ctx.fillStyle='#ff4fa3';ctx.fillRect(o.x,o.y,o.w,o.h)}ctx.shadowBlur=0;requestAnimationFrame(loop)}
</script></body></html>
