<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Paddle Pulse</title><link rel="stylesheet" href="../shared/game.css"></head><body><main class="game"><canvas id="c" aria-label="Paddle Pulse game"></canvas><div class="hud"><div class="pill">YOU <strong id="you">0</strong></div><div class="pill">CPU <strong id="cpu">0</strong></div></div><section class="panel" id="panel"><h1>PADDLE<br>PULSE</h1><p>First to seven wins. Move with your mouse, finger, or arrow keys.</p><button class="primary" id="start">Serve</button></section></main><script>const c=document.querySelector('#c'),g=c.getContext('2d'),panel=document.querySelector('#panel'),youEl=document.querySelector('#you'),cpuEl=document.querySelector('#cpu');let w,h,dpr,run=false,last=0,you=0,cpu=0,keys={};const me={x:32,y:0,w:14,h:100,target:0},ai={x:0,y:0,w:14,h:100},b={x:0,y:0,vx:340,vy:180,r:9};function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);ai.x=w-46;me.y=ai.y=h/2-50;me.target=me.y;resetBall(Math.random()>.5?1:-1)}resize();addEventListener('resize',resize);function resetBall(dir){b.x=w/2;b.y=h/2;b.vx=dir*340;b.vy=(Math.random()-.5)*330}function start(){you=cpu=0;youEl.textContent=cpuEl.textContent=0;run=true;panel.classList.add('hidden');resetBall(Math.random()>.5?1:-1);last=performance.now();requestAnimationFrame(loop)}function score(who){if(who==='you'){you++;youEl.textContent=you;resetBall(-1)}else{cpu++;cpuEl.textContent=cpu;resetBall(1)}if(you===7||cpu===7){run=false;panel.querySelector('h1').innerHTML=you===7?'YOU<br>WIN':'CPU<br>WINS';panel.querySelector('p').textContent=`Final score ${you}–${cpu}.`;panel.querySelector('button').textContent='Rematch';panel.classList.remove('hidden')}}function collide(p,dir){if(b.y+b.r>p.y&&b.y-b.r<p.y+p.h&&((dir<0&&b.x-b.r<p.x+p.w&&b.x>p.x)||(dir>0&&b.x+b.r>p.x&&b.x<p.x+p.w))){const n=(b.y-(p.y+p.h/2))/(p.h/2);b.vx=dir*Math.min(620,Math.abs(b.vx)*1.055);b.vy=n*390}}
function loop(t){if(!run)return;const dt=Math.min((t-last)/1000,.03);last=t;if(keys.ArrowUp||keys.w)me.target-=430*dt;if(keys.ArrowDown||keys.s)me.target+=430*dt;me.y+=(me.target-me.y)*Math.min(1,dt*13);me.y=Math.max(0,Math.min(h-me.h,me.y));ai.y+=(b.y-(ai.y+ai.h/2))*Math.min(1,dt*4.1);ai.y=Math.max(0,Math.min(h-ai.h,ai.y));b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<b.r||b.y>h-b.r){b.vy*=-1;b.y=Math.max(b.r,Math.min(h-b.r,b.y))}collide(me,1);collide(ai,-1);if(b.x<-30)score('cpu');if(b.x>w+30)score('you');draw();requestAnimationFrame(loop)}function draw(){g.fillStyle='#0a0b12';g.fillRect(0,0,w,h);g.setLineDash([14,18]);g.strokeStyle='rgba(255,255,255,.18)';g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.stroke();g.setLineDash([]);g.shadowBlur=12;g.shadowColor='#5865ff';g.fillStyle='#5865ff';g.fillRect(me.x,me.y,me.w,me.h);g.shadowColor='#ff4fa3';g.fillStyle='#ff4fa3';g.fillRect(ai.x,ai.y,ai.w,ai.h);g.shadowColor='#c8ff45';g.fillStyle='#c8ff45';g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.shadowBlur=0}c.addEventListener('pointermove',e=>me.target=e.clientY-me.h/2);addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);document.querySelector('#start').onclick=start;draw();</script></body></html>
