<!doctype html><html lang="en"><head>
    <script src="../../kardna-audio-bridge.js" data-kardna-audio-bridge></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Simon Spark</title><link rel="stylesheet" href="../shared/game.css"><style>.simon{position:relative;z-index:2;width:min(560px,calc(100% - 28px));display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.simon button{aspect-ratio:1;border:0;border-radius:34px;opacity:.58;cursor:pointer;transition:opacity .12s ease,transform .12s ease,filter .12s ease}.simon button:nth-child(1){background:#5865ff}.simon button:nth-child(2){background:#ff4fa3}.simon button:nth-child(3){background:#c8ff45}.simon button:nth-child(4){background:#ff8a3d}.simon button.active{opacity:1;transform:scale(.96);filter:brightness(1.35);box-shadow:0 0 50px currentColor}@media(max-width:520px){.simon{gap:8px}.simon button{border-radius:24px}}</style></head><body><main class="game"><div class="noise"></div><div class="hud"><div class="pill">LEVEL <strong id="level">0</strong></div><div class="pill">BEST <strong id="best">0</strong></div></div><div class="simon hidden" id="board"><button data-i="0" aria-label="Blue pad"></button><button data-i="1" aria-label="Pink pad"></button><button data-i="2" aria-label="Lime pad"></button><button data-i="3" aria-label="Orange pad"></button></div><section class="panel" id="panel"><h1>SIMON<br>SPARK</h1><p>Watch the pattern. Repeat it exactly. Every round adds one more spark.</p><button class="primary" id="start">Start sequence</button></section></main><script>const board=document.querySelector('#board'),panel=document.querySelector('#panel'),levelEl=document.querySelector('#level'),bestEl=document.querySelector('#best'),pads=[...board.children];let seq=[],pos=0,locked=true,best=Number(localStorage.simonSparkBest||0);bestEl.textContent=best;const wait=ms=>new Promise(r=>setTimeout(r,ms));async function start(){seq=[];pos=0;panel.classList.add('hidden');board.classList.remove('hidden');await wait(400);next()}async function next(){locked=true;pos=0;seq.push(Math.floor(Math.random()*4));levelEl.textContent=seq.length;await wait(450);for(const i of seq){pads[i].classList.add('active');await wait(350);pads[i].classList.remove('active');await wait(130)}locked=false}function press(i){if(locked)return;pads[i].classList.add('active');setTimeout(()=>pads[i].classList.remove('active'),170);if(i!==seq[pos])return end();pos++;if(pos===seq.length){locked=true;setTimeout(next,650)}}function end(){locked=true;best=Math.max(best,seq.length-1);localStorage.simonSparkBest=best;bestEl.textContent=best;setTimeout(()=>{board.classList.add('hidden');panel.querySelector('h1').innerHTML='SEQUENCE<br>LOST';panel.querySelector('p').textContent=`You reached level ${Math.max(0,seq.length-1)}.`;panel.querySelector('button').textContent='Try again';panel.classList.remove('hidden')},250)}pads.forEach(b=>b.onclick=()=>press(Number(b.dataset.i)));document.querySelector('#start').onclick=start;</script></body></html>
